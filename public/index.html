<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cricify</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1 id="logo">🏏 Cricify</h1>
    <nav>
      <a href="/" class="active">Players</a>
      <a href="/leaderboards.html">Leaderboards</a>
    </nav>
  </header>

  <main>
    <!-- Player list view -->
    <section id="list-view">
      <input id="search" type="search" placeholder="Search for a player..." autocomplete="off">
      <p id="list-message" class="message"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Player</th><th>Matches</th><th>Runs</th><th>Wickets</th><th>Catches</th></tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Single player view -->
    <section id="player-view" class="hidden">
      <button id="back" class="back">← Back to players</button>
      <h2 id="player-name"></h2>
      <p id="player-matches" class="sub"></p>

      <div class="tabs">
        <button class="tab active" data-tab="batting">Batting</button>
        <button class="tab" data-tab="bowling">Bowling</button>
        <button class="tab" data-tab="fielding">Fielding</button>
      </div>

      <div id="stats" class="stats"></div>
      <div id="chart-box" class="chart-box hidden">
        <canvas id="chart"></canvas>
      </div>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>
    const listView = document.getElementById("list-view");
    const playerView = document.getElementById("player-view");
    const searchBox = document.getElementById("search");
    const listBody = document.getElementById("list-body");
    const listMessage = document.getElementById("list-message");

    let currentPlayer = null;
    let searchTimer = null;

    // Make text safe to put inside HTML
    function esc(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Show a dash when a stat doesn't exist (e.g. average for someone never dismissed)
    function fmt(value) {
      return value === null || value === undefined ? "–" : value;
    }

    // Ask the server for players and fill in the table
    async function loadPlayers(query = "") {
      try {
        const res = await fetch(`/api/players?q=${encodeURIComponent(query)}`);
        const players = await res.json();

        listMessage.textContent = players.length === 0 ? "No players found." : "";
        listBody.innerHTML = players
          .map(
            (p) => `
          <tr class="clickable" data-id="${esc(p.id)}">
            <td>${esc(p.name)}</td>
            <td>${p.matches}</td>
            <td>${p.runs}</td>
            <td>${p.wickets}</td>
            <td>${p.catches}</td>
          </tr>`
          )
          .join("");
      } catch (err) {
        listMessage.textContent = "Could not load players. Is the server running?";
      }
    }

    // Which stat boxes to show for each tab
    function statsFor(p, tab) {
      if (tab === "batting") {
        const b = p.batting;
        return [
          ["Innings", b.innings], ["Runs", b.runs], ["Average", b.average],
          ["Strike rate", b.strikeRate], ["High score", b.highScore],
          ["50s", b.fifties], ["100s", b.hundreds], ["Balls faced", b.balls],
        ];
      }
      if (tab === "bowling") {
        const w = p.bowling;
        return [
          ["Overs", w.overs], ["Wickets", w.wickets], ["Runs conceded", w.runs],
          ["Economy", w.economy], ["Average", w.average], ["Strike rate", w.strikeRate],
        ];
      }
      const f = p.fielding;
      return [
        ["Catches", f.catches], ["Stumpings", f.stumpings],
        ["Run-outs", f.runOuts], ["Total dismissals", f.total],
      ];
    }
        let chart = null; // holds the current chart so we can replace it

    function drawChart(tab) {
      const seasons = currentPlayer.seasons || [];
      const box = document.getElementById("chart-box");

      // Remove the old chart before drawing a new one
      if (chart) {
        chart.destroy();
        chart = null;
      }

      if (seasons.length === 0) {
        box.classList.add("hidden");
        return;
      }
      box.classList.remove("hidden");

      const labels = seasons.map((s) => s.season);
      const green = "#0b6e4f";
      const orange = "#e08a1e";
      const blue = "#2f6fb0";
      let datasets, scales, title;

      if (tab === "batting") {
        title = "Runs and strike rate by season";
        datasets = [
          { type: "bar", label: "Runs", data: seasons.map((s) => s.batting.runs), backgroundColor: green, yAxisID: "y" },
          { type: "line", label: "Strike rate", data: seasons.map((s) => s.batting.strikeRate), borderColor: orange, backgroundColor: orange, yAxisID: "y1", tension: 0.3, spanGaps: true },
        ];
        scales = {
          y: { beginAtZero: true, title: { display: true, text: "Runs" } },
          y1: { position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "Strike rate" } },
        };
      } else if (tab === "bowling") {
        title = "Wickets and economy by season";
        datasets = [
          { type: "bar", label: "Wickets", data: seasons.map((s) => s.bowling.wickets), backgroundColor: green, yAxisID: "y" },
          { type: "line", label: "Economy", data: seasons.map((s) => s.bowling.economy), borderColor: orange, backgroundColor: orange, yAxisID: "y1", tension: 0.3, spanGaps: true },
        ];
        scales = {
          y: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: "Wickets" } },
          y1: { position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "Economy" } },
        };
      } else {
        title = "Dismissals by season";
        datasets = [
          { label: "Catches", data: seasons.map((s) => s.fielding.catches), backgroundColor: green },
          { label: "Stumpings", data: seasons.map((s) => s.fielding.stumpings), backgroundColor: orange },
          { label: "Run-outs", data: seasons.map((s) => s.fielding.runOuts), backgroundColor: blue },
        ];
        scales = {
          x: { stacked: true },
          y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } },
        };
      }

      chart = new Chart(document.getElementById("chart"), {
        type: "bar",
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { title: { display: true, text: title } },
          scales,
        },
      });
    }

    function showTab(tab) {
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      document.getElementById("stats").innerHTML = statsFor(currentPlayer, tab)
        .map(
          ([label, value]) => `
        <div class="stat">
          <div class="value">${fmt(value)}</div>
          <div class="label">${label}</div>
        </div>`
        )
        .join("");

      drawChart(tab); // NEW: draw the chart for this tab
    }
    

    async function openPlayer(id) {
      const res = await fetch(`/api/players/${encodeURIComponent(id)}`);
      if (!res.ok) return;
      currentPlayer = await res.json();

      document.getElementById("player-name").textContent = currentPlayer.name;
      document.getElementById("player-matches").textContent = `${currentPlayer.matches} matches`;

      listView.classList.add("hidden");
      playerView.classList.remove("hidden");
      showTab("batting");
    }

    function showList() {
      playerView.classList.add("hidden");
      listView.classList.remove("hidden");
    }

    // ----- Wire up the page -----
    listBody.addEventListener("click", (e) => {
      const row = e.target.closest("tr[data-id]");
      if (row) openPlayer(row.dataset.id);
    });

    document.querySelector(".tabs").addEventListener("click", (e) => {
      if (e.target.dataset.tab) showTab(e.target.dataset.tab);
    });

    searchBox.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadPlayers(searchBox.value), 250); // wait until they pause typing
    });

    document.getElementById("back").addEventListener("click", showList);
    document.getElementById("logo").addEventListener("click", showList);

    loadPlayers();
        // If we arrived from a leaderboard link like /#player=abc123, open that player
    const hashPlayer = new URLSearchParams(location.hash.slice(1)).get("player");
    if (hashPlayer) openPlayer(hashPlayer);
  </script>
</body>
</html>
